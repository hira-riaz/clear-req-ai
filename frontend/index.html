<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClearReq AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-screen" id="authScreen">
    <div class="card auth-card">
      <div class="header"><span class="brand">ClearReq AI</span></div>
      <div class="auth-tabs">
        <button class="auth-tab active" id="loginTab">Log in</button>
        <button class="auth-tab" id="registerTab">Sign up</button>
      </div>
      <input id="authName" class="answer-input hidden" placeholder="Your name" />
      <input id="authEmail" class="answer-input" placeholder="Email" type="email" />
      <input id="authPassword" class="answer-input" placeholder="Password (min 8 characters)" type="password" />
      <p class="auth-error hidden" id="authError"></p>
      <div class="actions"><button id="authSubmitBtn">Log in</button></div>
    </div>
  </div>

  <div class="app-shell hidden" id="appShell">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="brand">ClearReq AI</span>
        <button class="icon-btn" id="newSessionSidebarBtn" title="New session">+</button>
      </div>
      <input id="sessionSearch" class="answer-input sidebar-search" placeholder="Search sessions..." />
      <div class="sidebar-list" id="sidebarList"></div>
      <div class="sidebar-footer">
        <span id="userNameLabel"></span>
        <button class="text-btn" id="logoutBtn">Log out</button>
      </div>
    </div>

    <div class="main-panel">
      <div class="card" id="startCard">
        <div class="header"><span class="brand">Start a session</span></div>
        <input id="projectNameInput" class="answer-input" placeholder="Project name (e.g. Hospital System)" />
        <div class="actions"><button id="startSessionBtn">Start session</button></div>
      </div>

      <div class="card hidden" id="discoveryCard">
        <div class="header"><span class="brand">Project Discovery</span></div>
        <p class="label">A few quick questions before we start gathering requirements.</p>
        <div id="discoveryStepper"></div>
      </div>

      <div class="card hidden" id="mainCard">
        <div class="header">
          <span class="brand" id="projectLabel"></span>
          <button class="icon-btn" id="renameBtn" title="Rename">✎</button>
        </div>
        <p class="label" id="reqCounterLabel">Requirements added: 0</p>
        <p class="label">Requirement input</p>
        <textarea id="requirementInput" placeholder="e.g. The system should be secure and easy to use."></textarea>
        <div class="actions"><button id="analyzeBtn">Analyze</button></div>
        <div id="ambiguitiesSection" class="hidden"><div id="ambiguityStepper"></div></div>
        <div class="actions actions-split finish-row">
          <button id="finishBtn" class="secondary-btn" disabled>Finish &amp; review requirements</button>
        </div>
      </div>

      <div class="card hidden" id="reviewCard">
        <div class="header"><span class="brand">Review</span></div>
        <p class="label">Review translated requirements before generating the final report.</p>
        <div id="reviewList"></div>
        <div class="actions"><button id="generateReportBtn">Generate report</button></div>
      </div>

      <div class="card hidden" id="reportCard">
        <div class="header"><span class="brand">Report</span></div>
        <div id="reportDoc" class="report-doc"></div>
        <div class="actions actions-split">
          <button id="exportDocBtn" class="secondary-btn">Export as Word</button>
          <button id="backToSidebarBtn">Done</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
