<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClearReq AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <span class="brand">ClearReq AI</span>
      <span class="project-label">Session #1</span>
    </div>

    <p class="label">Requirement input</p>
    <textarea id="requirementInput" placeholder="e.g. The system should be secure and easy to use.">The system should be secure and easy to use.</textarea>
    <div class="actions">
      <button id="analyzeBtn">Analyze</button>
    </div>

    <div id="ambiguitiesSection" class="hidden">
      <p class="label">Ambiguities detected</p>
      <div id="ambiguitiesList"></div>
      <div class="actions">
        <button id="translateBtn">Translate</button>
      </div>
    </div>

    <div id="resultSection" class="hidden">
      <div class="result-header">
        <p class="label">Translated requirement</p>
        <span id="confidenceBadge" class="badge"></span>
      </div>
      <div id="translatedText" class="result-box"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
