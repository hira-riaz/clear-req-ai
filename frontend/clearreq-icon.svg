<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f5f5f1; }
      .card { fill: #ffffff; }
      .jg { fill: #234c3a; }
      .jg-stroke { stroke: #234c3a; }
      .mint { fill: #e1f5ee; }
      .mint-stroke { stroke: #e1f5ee; }
    </style>
  </defs>

  <!-- rounded card behind mark -->
  <rect x="60" y="60" width="280" height="280" rx="56" class="jg"/>

  <!-- ambiguous / messy lines (left, inside card, mint on dark green) -->
  <path d="M 110 150 Q 130 140 150 150 T 190 150" fill="none" class="mint-stroke" stroke-width="10" stroke-linecap="round" opacity="0.55"/>
  <path d="M 110 185 Q 135 172 160 185 T 210 185" fill="none" class="mint-stroke" stroke-width="10" stroke-linecap="round" opacity="0.55"/>

  <!-- clarity lens circle -->
  <circle cx="245" cy="200" r="62" class="card"/>
  <circle cx="245" cy="200" r="62" fill="none" class="mint-stroke" stroke-width="10"/>
  <line x1="289" y1="244" x2="322" y2="277" class="mint-stroke" stroke-width="14" stroke-linecap="round"/>

  <!-- clean straight lines visible inside the lens (clarity) -->
  <line x1="216" y1="188" x2="274" y2="188" class="jg-stroke" stroke-width="9" stroke-linecap="round"/>
  <line x1="216" y1="212" x2="262" y2="212" class="jg-stroke" stroke-width="9" stroke-linecap="round"/>

  <!-- checkmark tucked bottom-left to reinforce "resolved / structured" -->
  <path d="M 108 245 L 128 265 L 168 220" fill="none" class="mint-stroke" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>
